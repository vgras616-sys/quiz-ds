<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2f5d8a">
<title>Révisions DS</title><link rel="stylesheet" href="style.css"><style>.mast{margin:0 0 12px}.mast .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.mast .b{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.mast .b i{display:block;height:100%;border-radius:5px;transition:width .3s}.lv0{background:#d64545}.lv1{background:#f0932b}.lv2{background:#2e9d5b}.t0{color:#d64545}.t1{color:#e08416}.t2{color:#2e9d5b}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}</style></head>
<body><div class="wrap"><h1>Révisions DS</h1><p class="sub">Matières à travailler</p><div id="list"></div><div id="done"></div></div>
<script src="ds.js"></script>
<script src="data/procedes-fabrication.js"></script>
<script>
const KEY="dsPasses";
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
const QZ={};
function qk(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
function mastery(d){
  let st={};try{st=JSON.parse(localStorage.getItem('dsScores:'+d.id)||'{}')}catch(e){}
  const q=(window.QUIZ&&window.QUIZ.id===d.id)?window.QUIZ.q:null;
  const total=q?q.length:d.count;
  let seen=0,pts=0,acq=0;
  if(q)q.forEach(x=>{let v=st[qk(x[1])];if(v!==undefined){v=Math.min(2,v);seen++;pts+=v;if(v>=2)acq++}});
  const pct=seen?Math.round(pts/(2*seen)*100):0;
  const cov=total?Math.round(seen/total*100):0;
  const lv=seen===0?-1:pct>=75?2:pct>=40?1:0;
  const lab=seen===0?'Pas encore commencé':['À retravailler','En progrès','Maîtrisé'][lv];
  const few=seen>0&&cov<30?' · encore peu de questions vues':'';
  return `<div class="mast"><div class="l"><span><span class="dot ${lv<0?'':'lv'+lv}" style="${lv<0?'background:var(--line)':''}"></span><b class="${lv<0?'':'t'+lv}">Maîtrise : ${pct} %</b> · ${lab}</span></div><div class="b"><i class="lv${Math.max(lv,0)}" style="width:${seen?pct:0}%"></i></div><div class="l" style="margin:6px 0 0;color:var(--mute)"><span>${seen}/${total} questions vues (${cov} %)${few}</span></div></div>`;
}
function render(){
  const passed=get(),todo=DS.filter(d=>!passed.includes(d.id)),done=DS.filter(d=>passed.includes(d.id));
  const L=document.getElementById('list');
  L.innerHTML=todo.length?todo.map(d=>`<div class="card ds"><h3>${d.title}</h3><p>${d.desc} · ${d.count} questions</p>${mastery(d)}
    <div class="row"><a class="btn" href="${d.page}">Réviser</a><button class="lnk" data-p="${d.id}">Matière passée</button></div></div>`).join(''):`<div class="card"><p class="center">Aucune matière à réviser 🎉</p></div>`;
  L.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    if(b.dataset.c){set(get().concat(b.dataset.p));render();return}
    b.dataset.c=1;b.textContent="Confirmer : effacer le quiz";b.classList.add('red');
    setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent="Matière passée";b.classList.remove('red')}},4000);
  });
  const D=document.getElementById('done');
  D.innerHTML=done.length?`<p class="sub">Matières passées (quiz masqués)</p>`+done.map(d=>`<div class="card ds"><h3>${d.title}</h3><button class="lnk" data-r="${d.id}">Remettre dans la liste</button></div>`).join(''):'';
  D.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{set(get().filter(x=>x!==b.dataset.r));render()});
}
render();
</script></body></html>
